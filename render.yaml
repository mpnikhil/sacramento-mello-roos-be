# Render.com deployment configuration
# Deploy with: render deploy or connect your GitHub repo

services:
  - type: web
    name: sacramento-tax-api
    env: docker
    region: oregon # Choose: oregon, frankfurt, ohio, singapore
    plan: free # Free tier - 750 hours/month
    healthCheckPath: /health
    envVars:
      - key: BROWSER_HEADLESS
        value: true
      - key: CACHE_MAX_AGE_DAYS
        value: 30
      - key: PYTHONUNBUFFERED
        value: 1

